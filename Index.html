<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositorio Personal - Drive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        .loader {
            border: 2px solid #e5e7eb;
            border-top: 2px solid #007aff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .animate-fade-out {
            animation: fadeOut 0.2s ease-out forwards;
        }
        
        /* Scrollbar personalizada y elegante */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }
        .dark::-webkit-scrollbar-thumb {
            background: #4b5563;
        }
        .dark::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
    </style>
</head>
<body class="bg-[#fbfbfd] dark:bg-[#0f1115] font-sans antialiased text-gray-900 dark:text-gray-100 flex flex-col md:flex-row h-screen overflow-hidden transition-colors duration-300">

    <!-- Barra Lateral (Sidebar) -->
    <aside class="w-full md:w-72 bg-[#f5f5f7] dark:bg-[#16181d] border-b md:border-b-0 md:border-r border-gray-200/50 dark:border-gray-800/80 flex flex-col flex-shrink-0 md:h-full z-10 transition-colors duration-300">
        <div class="px-6 py-8 flex flex-col gap-6">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white">Mi Sitio</h1>
                <button onclick="toggleDarkMode()" class="p-2 text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-800 rounded-full transition-colors" title="Cambiar tema">
                    <svg id="theme-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
            </div>
            <!-- Search Box -->
            <div class="relative w-full">
                <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="search-box" placeholder="Buscar archivos..." class="w-full pl-10 pr-4 py-2.5 bg-white/60 dark:bg-gray-800/60 border border-gray-200/60 dark:border-gray-700/60 text-gray-900 dark:text-white text-sm rounded-2xl focus:bg-white dark:focus:bg-gray-800 focus:ring-4 focus:ring-[#007aff]/10 focus:border-[#007aff] shadow-[0_2px_10px_rgba(0,0,0,0.02)] outline-none transition-all duration-300 placeholder-gray-400 dark:placeholder-gray-500">
            </div>
        </div>
        <div class="px-6 pb-3 text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest hidden md:block">
            Categorías
        </div>
        <nav id="sidebar-nav" class="flex md:flex-col overflow-x-auto md:overflow-y-auto px-4 md:px-3 pb-3 md:pb-6 space-x-2 md:space-x-0 md:space-y-1 scrollbar-hide">
            <div class="flex justify-center items-center p-4 w-full"><div class="loader"></div></div>
        </nav>
    </aside>

    <!-- Contenido Principal -->
    <main class="flex-1 h-full overflow-y-scroll overflow-x-hidden">
        <div class="w-full max-w-6xl mx-auto px-6 py-8 md:py-12">

        <div class="flex flex-col md:flex-row justify-end items-center mb-10 gap-4 md:gap-8">
            <div class="flex items-center gap-6">
                <!-- Controles de Vista -->
                <div class="flex items-center">
                    <div id="view-controls" class="inline-flex bg-gray-100/80 dark:bg-gray-800/80 p-1.5 rounded-2xl" role="group">
                        <button type="button" data-view="list" class="px-5 py-1.5 text-sm font-semibold rounded-xl text-gray-900 dark:text-white bg-white dark:bg-gray-700 shadow-[0_2px_8px_rgba(0,0,0,0.06)] transition-all">
                            Lista
                        </button>
                        <button type="button" data-view="grid" class="px-5 py-1.5 text-sm font-medium rounded-xl text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-all">
                            Grilla
                        </button>
                    </div>
                </div>
    
                <!-- Controles de Orden -->
                <div class="flex items-center">
                    <label for="sort-options" class="text-sm font-semibold text-gray-400 dark:text-gray-500 mr-3">ORDENAR</label>
                    <select id="sort-options" class="bg-white/60 dark:bg-gray-800/60 border border-gray-200/60 dark:border-gray-700/60 text-gray-800 dark:text-gray-200 text-sm rounded-2xl focus:bg-white dark:focus:bg-gray-800 focus:ring-4 focus:ring-[#007aff]/10 focus:border-[#007aff] px-5 py-2.5 shadow-[0_2px_10px_rgba(0,0,0,0.02)] appearance-none cursor-pointer hover:bg-white dark:hover:bg-gray-700 transition-all outline-none font-medium">
                        <option value="default">Predeterminado</option>
                        <option value="name_asc">Nombre (A-Z)</option>
                        <option value="name_desc">Nombre (Z-A)</option>
                        <option value="date_desc">Fecha (Más reciente)</option>
                        <option value="date_asc">Fecha (Más antiguo)</option>
                    </select>
                </div>
            </div>
        </div>

        <section class="w-full bg-transparent">
            
            <div id="list-header" class="w-full grid-cols-12 gap-4 px-6 py-3 text-[11px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider hidden md:grid border-b border-gray-200/60 dark:border-gray-800/60 mb-3">
                <div class="col-span-6 md:col-span-5">Archivo</div>
                <div class="col-span-3 hidden md:block">Modificación</div>
                <div class="col-span-3 md:col-span-2 text-right">Tamaño</div>
                <div class="col-span-3 md:col-span-2 text-right">Acción</div>
            </div>

            <div id="loading-state" class="flex justify-center items-center p-8">
                <div class="loader mr-3"></div>
                <span class="text-gray-500 font-medium">Conectando con Google Drive...</span>
            </div>

            <div id="file-list" class="hidden w-full">
            </div>

            <div id="error-state" class="hidden p-8 text-center text-red-600 flex flex-col items-center">
                <p id="error-message">Error al recuperar los archivos.</p>
                <button onclick="main()" class="mt-4 px-6 py-2 bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 rounded-full text-sm font-medium hover:bg-gray-800 dark:hover:bg-white transition-colors shadow-sm">Reintentar</button>
            </div>

        </div>
        </section>
    </main>

    <script>
        // Configuración requerida
        const API_KEY = 'AIzaSyARv4q_6_aDPE9JAwN9pcoKtDF-0v1csQE';
        const ROOT_FOLDER_ID = '1imz_VssaBHmkh-HhN0493I4rDUqu-r5J'; // ID de la carpeta principal

        // --- METADATOS PERSONALIZADOS ---
        // Ahora se intentará leer dinámicamente desde un "config.json" en tu Drive
        let fileMetadata = {};

        // Estado global de la aplicación
        let currentItems = [];
        let currentSort = 'default';
        let currentView = 'list';
        let currentFolderId = null;
        let navigationStack = [{ id: ROOT_FOLDER_ID, name: 'Inicio' }];
        
        // --- INICIALIZAR TEMA OSCURO ---
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>';
            } else {
                document.documentElement.classList.remove('dark');
            }
        }
        
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('theme-icon').innerHTML = isDark 
                ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>'
                : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>';
        }
        initTheme(); // Ejecutar al cargar la página

        const fileIcon = `
            <svg class="w-6 h-6 text-[#007aff] mr-4 flex-shrink-0 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
            </svg>
        `;

        async function fetchMetadataConfig() {
            try {
                const query = `'${ROOT_FOLDER_ID}' in parents and name = 'config.json' and trashed = false`;
                const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&key=${API_KEY}`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.files && data.files.length > 0) {
                    const configRes = await fetch(`https://www.googleapis.com/drive/v3/files/${data.files[0].id}?alt=media&key=${API_KEY}`);
                    fileMetadata = await configRes.json();
                }
            } catch (e) {
                console.warn("No config.json encontrado. Se usarán metadatos por defecto.", e);
            }
        }

        async function downloadFile(fileId, fileName) {
            const url = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${API_KEY}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Error HTTP: ${response.status}`);
            const blob = await response.blob();
            const blobUrl = window.URL.createObjectURL(blob);
            const a = Object.assign(document.createElement('a'), { href: blobUrl, download: fileName });
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(blobUrl);
            a.remove();
        }

        async function fetchDriveFolders() {
            const query = `'${ROOT_FOLDER_ID}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`;
            const fields = 'files(id,name)';
            const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=${encodeURIComponent(fields)}&key=${API_KEY}`;

            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
            const data = await response.json();
            return data.files || [];
        }

        async function fetchDriveItems(folderId) {
            if (!folderId) return [];
            const query = `'${folderId}' in parents and trashed = false`;
            const fields = 'files(id,name,modifiedTime,size,webViewLink,hasThumbnail,thumbnailLink,mimeType)';
            const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=${encodeURIComponent(fields)}&key=${API_KEY}`;
 
            const response = await fetch(url);
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error.message || `HTTP Error: ${response.status}`);
            }
            const data = await response.json();
            return data.files || [];
        }

        function formatSize(bytes) {
            if (!bytes || bytes === 0) return '-';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function displayFiles() {
            const listContainer = document.getElementById('file-list');
            const listHeader = document.getElementById('list-header');
            const loadingState = document.getElementById('loading-state');
            
            loadingState.classList.add('hidden');

            let filesToDisplay;
            const searchTerm = document.getElementById('search-box').value.trim().toLowerCase();

            if (searchTerm) {
                filesToDisplay = currentItems.filter(file => {
                    const metadata = fileMetadata[file.id] || {};
                    const title = metadata.title || file.name;
                    return title.toLowerCase().includes(searchTerm);
                });
            } else {
                filesToDisplay = currentItems;
            }

            let sortedFiles = [...filesToDisplay];
            switch (currentSort) {
                case 'name_asc': sortedFiles.sort((a, b) => a.name.localeCompare(b.name)); break;
                case 'name_desc': sortedFiles.sort((a, b) => b.name.localeCompare(a.name)); break;
                case 'date_desc': sortedFiles.sort((a, b) => new Date(b.modifiedTime) - new Date(a.modifiedTime)); break;
                case 'date_asc': sortedFiles.sort((a, b) => new Date(a.modifiedTime) - new Date(b.modifiedTime)); break;
            }
            
            // Asegurar que las carpetas siempre se muestren primero
            sortedFiles.sort((a, b) => {
                const aIsFolder = a.mimeType === 'application/vnd.google-apps.folder';
                const bIsFolder = b.mimeType === 'application/vnd.google-apps.folder';
                if (aIsFolder && !bIsFolder) return -1;
                if (!aIsFolder && bIsFolder) return 1;
                return 0;
            });

            // Reiniciar animación de transición
            listContainer.className = '';
            void listContainer.offsetWidth;

            if (currentView === 'grid') {
                listHeader.style.display = 'none';
                listContainer.className = 'w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-fade-in';
            } else {
                listHeader.style.display = '';
                listContainer.className = 'w-full bg-white dark:bg-[#16181d] rounded-3xl shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-gray-100 dark:border-gray-800/60 overflow-hidden animate-fade-in';
            }

            if (sortedFiles.length === 0) {
                listContainer.innerHTML = `
                    <div class="col-span-full p-16 flex flex-col items-center justify-center text-center bg-white dark:bg-[#16181d] rounded-3xl border border-gray-100 dark:border-gray-800/60 shadow-sm w-full animate-fade-in">
                        <svg class="w-20 h-20 text-gray-300 dark:text-gray-700 mb-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                        <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-2">No se encontraron archivos</h3>
                        <p class="text-gray-500 dark:text-gray-400 max-w-md text-sm">La carpeta está vacía o tu búsqueda no arrojó resultados.</p>
                    </div>`;
                listContainer.classList.remove('hidden');
                return;
            }

            listContainer.innerHTML = sortedFiles.map(file => {
                const isFolder = file.mimeType === 'application/vnd.google-apps.folder';
                const metadata = fileMetadata[file.id] || {};
                const title = metadata.title || file.name;

                const dateObj = file.modifiedTime ? new Date(file.modifiedTime) : new Date();
                const formattedDate = dateObj.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
                const formattedSize = formatSize(file.size);

                // Lógica de previsualización estilo Google Drive
                let imageElement = '';
                if (isFolder) {
                    imageElement = `
                    <div class="w-full h-48 bg-[#f5f5f7] dark:bg-gray-800 flex items-center justify-center rounded-2xl cursor-pointer" onclick="navigateToFolder('${file.id}', '${file.name}')">
                        <svg class="w-20 h-20 text-[#007aff]/40 dark:text-[#3b82f6]/40" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg>
                    </div>`;
                } else if (metadata.imageUrl) {
                    imageElement = `<img src="${metadata.imageUrl}" alt="${title}" class="w-full h-48 object-cover bg-gray-100 rounded-2xl">`;
                } else if (file.hasThumbnail && file.thumbnailLink) {
                    const highResThumbnail = file.thumbnailLink.replace(/=s\d+/, '=s600'); // Aumentar calidad de la miniatura a 600px
                    imageElement = `<img src="${highResThumbnail}" alt="Miniatura de ${title}" class="w-full h-48 object-cover bg-gray-100 rounded-2xl">`;
                } else {
                    imageElement = `
                    <div class="w-full h-48 bg-[#f5f5f7] dark:bg-gray-800 flex items-center justify-center rounded-2xl cursor-pointer" onclick="downloadFile('${file.id}', '${file.name}')">
                        <svg class="w-16 h-16 text-gray-300 dark:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    </div>`;
                }

                if (currentView === 'grid') {
                    const actionButtons = isFolder 
                        ? `<button onclick="navigateToFolder('${file.id}', '${file.name}')" class="flex-1 px-4 py-2.5 bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 text-sm font-semibold rounded-xl hover:bg-gray-200 dark:hover:bg-gray-700 transition-all">Abrir Carpeta</button>`
                        : `<button onclick="downloadFile('${file.id}', '${file.name}')" class="flex-1 px-4 py-2.5 bg-sky-500 text-white text-sm font-semibold rounded-xl hover:bg-sky-600 transition-all shadow-[0_4px_12px_rgba(14,165,233,0.2)] hover:shadow-[0_6px_16px_rgba(14,165,233,0.3)]">Descargar</button>
                           <a href="${file.webViewLink}" target="_blank" class="px-4 py-2.5 bg-gray-50 dark:bg-gray-800 text-gray-600 dark:text-gray-300 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" title="Ver en Drive"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg></a>`;

                    return `
                    <div class="flex flex-col bg-white dark:bg-[#16181d] p-2.5 rounded-[2rem] shadow-[0_4px_20px_rgba(0,0,0,0.04)] dark:shadow-none border border-gray-200/80 dark:border-gray-800 overflow-hidden transition-all duration-400 hover:shadow-[0_12px_30px_rgba(0,0,0,0.08)] dark:hover:border-gray-700 hover:-translate-y-1.5 group">
                        ${imageElement}
                        <div class="p-4 px-3 flex flex-col flex-grow justify-between cursor-pointer" ${isFolder ? `onclick="navigateToFolder('${file.id}', '${file.name}')"` : ''}>
                            <h3 class="text-base font-semibold text-gray-900 dark:text-white tracking-tight truncate mb-2 group-hover:text-sky-500 transition-colors" title="${title}">${title}</h3>
                            <div class="text-[11px] font-semibold text-gray-400 mt-1 flex justify-between uppercase tracking-wider">
                                <span>${formattedDate}</span>
                                <span>${isFolder ? 'Carpeta' : formattedSize}</span>
                            </div>
                        </div>
                        <div class="px-3 pb-2 pt-0 flex gap-3">
                            ${actionButtons}
                        </div>
                    </div>`;
                } else {
                    const icon = isFolder 
                        ? `<svg class="w-6 h-6 text-[#007aff] dark:text-[#3b82f6] mr-4 flex-shrink-0 opacity-80" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg>`
                        : fileIcon;
                    const actionBtn = isFolder
                        ? `<button onclick="navigateToFolder('${file.id}', '${file.name}')" class="px-5 py-2 bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300 text-sm font-medium rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Abrir</button>`
                        : `<button onclick="downloadFile('${file.id}', '${file.name}')" title="Descargar Archivo" class="px-5 py-2 bg-sky-500 text-white text-sm font-medium rounded-lg hover:bg-sky-600 transition-colors shadow-sm">Descargar</button>`;
                        
                    return `
                    <div class="grid grid-cols-12 gap-4 p-6 hover:bg-gray-50/80 dark:hover:bg-gray-800/40 items-center transition-colors border-b border-gray-100 dark:border-gray-800/60 last:border-0 group cursor-pointer" ${isFolder ? `onclick="navigateToFolder('${file.id}', '${file.name}')"` : ''}>
                        <div class="col-span-12 sm:col-span-6 md:col-span-5 flex items-center overflow-hidden">
                            ${icon}
                            <span class="text-sm font-semibold text-gray-800 dark:text-gray-200 tracking-tight truncate group-hover:text-[#007aff] transition-colors" title="${title}">${title}</span>
                        </div>
                        <div class="hidden md:block col-span-3 text-sm text-gray-500">${formattedDate}</div>
                        <div class="hidden sm:block col-span-3 md:col-span-2 text-right text-sm text-gray-500 font-medium">${isFolder ? '-' : formattedSize}</div>
                        <div class="col-span-12 sm:col-span-3 md:col-span-2 flex flex-row justify-end gap-3 mt-3 sm:mt-0">
                            ${actionBtn}
                        </div>
                    </div>`;
                }
            }).join('');
            
            listContainer.classList.remove('hidden');
        }

        async function navigateToFolder(folderId, folderName, fromSidebar = false) {
            if (fromSidebar) {
                if (folderId === ROOT_FOLDER_ID) {
                    navigationStack = [{ id: ROOT_FOLDER_ID, name: 'Inicio' }];
                } else {
                    navigationStack = [{ id: ROOT_FOLDER_ID, name: 'Inicio' }, { id: folderId, name: folderName }];
                }
            } else if (folderId === ROOT_FOLDER_ID) {
                navigationStack = [{ id: ROOT_FOLDER_ID, name: 'Inicio' }];
            } else {
                const existingIndex = navigationStack.findIndex(item => item.id === folderId);
                if (existingIndex !== -1) {
                    navigationStack = navigationStack.slice(0, existingIndex + 1);
                } else {
                    navigationStack.push({ id: folderId, name: folderName });
                }
            }

            currentFolderId = folderId;
            document.getElementById('search-box').value = '';

            // Resaltar en sidebar
            document.querySelectorAll('#sidebar-nav button').forEach(btn => {
                const isActive = btn.dataset.id === folderId;
                btn.className = `whitespace-nowrap md:whitespace-normal md:w-full text-left px-4 md:px-4 py-2 md:py-3 rounded-2xl text-sm transition-all flex items-center gap-3 flex-shrink-0 md:flex-shrink group ${isActive ? 'bg-white dark:bg-gray-800 text-[#007aff] dark:text-[#3b82f6] font-semibold shadow-[0_2px_10px_rgba(0,0,0,0.03)] border border-gray-200/60 dark:border-gray-700/60' : 'text-gray-600 dark:text-gray-400 border border-transparent hover:bg-gray-200/50 dark:hover:bg-gray-800/50 hover:text-gray-900 dark:hover:text-white'}`;
            });

            const loadingState = document.getElementById('loading-state');
            const listContainer = document.getElementById('file-list');
            listContainer.classList.add('hidden');
            loadingState.classList.remove('hidden');

            try {
                currentItems = await fetchDriveItems(folderId);
                displayFiles();
            } catch (error) {
                document.getElementById('error-message').textContent = "Error al conectar con Drive: " + error.message;
                loadingState.classList.add('hidden');
                document.getElementById('error-state').classList.remove('hidden');
            }
        }

        function renderSidebar(folders) {
            const nav = document.getElementById('sidebar-nav');
            if (folders.length === 0) {
                nav.innerHTML = '<div class="p-4 text-sm text-gray-500 dark:text-gray-400 w-full text-center md:text-left">No hay carpetas.</div>';
                return;
            }
            
            nav.innerHTML = folders.map(folder => `
                <button data-id="${folder.id}" onclick="navigateToFolder('${folder.id}', '${folder.name.replace(/'/g, "\\'")}', true)"
                    class="whitespace-nowrap md:whitespace-normal md:w-full text-left px-4 md:px-4 py-2 md:py-3 rounded-2xl text-sm transition-all flex items-center gap-3 flex-shrink-0 md:flex-shrink group text-gray-600 dark:text-gray-400 border border-transparent hover:bg-gray-200/50 dark:hover:bg-gray-800/50 hover:text-gray-900 dark:hover:text-white">
                    <svg class="w-4 h-4 opacity-70 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg>
                    <span class="truncate font-medium flex-grow">${folder.name}</span>
                </button>
            `).join('');
        }

        async function main() {
            const loadingState = document.getElementById('loading-state');
            const errorState = document.getElementById('error-state');
            const sidebarNav = document.getElementById('sidebar-nav');

            loadingState.classList.remove('hidden');
            errorState.classList.add('hidden');
            sidebarNav.innerHTML = '<div class="flex justify-center items-center p-4 w-full"><div class="loader"></div></div>';

            document.querySelectorAll('#view-controls button').forEach(btn => btn.className = 'px-5 py-1.5 text-sm font-medium rounded-xl text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-all');
            document.querySelector(`#view-controls button[data-view="${currentView}"]`).className = 'px-5 py-1.5 text-sm font-semibold rounded-xl text-gray-900 dark:text-white bg-white dark:bg-gray-700 shadow-[0_2px_8px_rgba(0,0,0,0.06)] transition-all';
            
            try {
                const folders = await fetchDriveFolders();
                folders.sort((a, b) => a.name.localeCompare(b.name)); // Ordenar carpetas alfabéticamente
                renderSidebar(folders);

                // Cargar metadatos dinámicos
                await fetchMetadataConfig();

                loadingState.classList.add('hidden');

                if (folders.length > 0) {
                    navigateToFolder(folders[0].id, folders[0].name);
                } else {
                    displayFiles();
                }
            } catch (error) {
                sidebarNav.innerHTML = '<div class="p-4 text-sm text-red-500 w-full text-center md:text-left">Error de conexión.</div>';
                loadingState.classList.add('hidden');
                errorState.classList.remove('hidden');
                document.getElementById('error-message').textContent = "No se pudieron cargar las carpetas. " + error.message;
            }
        }

        document.getElementById('sort-options').addEventListener('change', (e) => {
            currentSort = e.target.value;
            displayFiles();
        });

        document.getElementById('view-controls').addEventListener('click', (e) => {
            const button = e.target.closest('button');
            if (!button) return;
            const view = button.dataset.view;
            const listContainer = document.getElementById('file-list');

            if (view && view !== currentView) {
                listContainer.classList.add('animate-fade-out');
                
                setTimeout(() => {
                    currentView = view;
                    document.querySelectorAll('#view-controls button').forEach(btn => {
                        btn.className = 'px-5 py-1.5 text-sm font-medium rounded-xl text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-all';
                    });
                    button.className = 'px-5 py-1.5 text-sm font-semibold rounded-xl text-gray-900 dark:text-white bg-white dark:bg-gray-700 shadow-[0_2px_8px_rgba(0,0,0,0.06)] transition-all';
                    displayFiles();
                }, 200); // Coincide con la duración de fade-out
            }
        });

        document.getElementById('search-box').addEventListener('input', displayFiles);
        document.addEventListener('DOMContentLoaded', main);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositorio Personal - Drive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0ea5e9', // Azul cielo (Sky Blue)
                        surface: {
                            light: 'rgba(226, 232, 240, 0.7)',
                            dark: 'rgba(15, 23, 42, 0.7)'
                        }
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .loader {
            border: 2px solid transparent;
            border-top: 2px solid #0ea5e9;
            border-right: 2px solid #0ea5e9;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.95); }
        }
        .animate-fade-out {
            animation: fadeOut 0.2s ease-out forwards;
        }
        
        .file-item-wrapper {
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .file-item-wrapper.is-loaded {
            opacity: 1;
        }
        
        /* Scrollbar oculta pero funcional */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(14, 165, 233, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(14, 165, 233, 0.5);
        }
        
        /* Efecto de cristal general */
        .glass-panel {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        
        /* Slider personalizado */
        .custom-zoom-slider {
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: #cbd5e1;
            border-radius: 4px;
            outline: none;
            transition: background 0.3s ease;
        }
        .dark .custom-zoom-slider {
            background: #334155;
        }
        .custom-zoom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #0ea5e9;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(14, 165, 233, 0.3);
            transition: transform 0.15s ease;
        }
        .custom-zoom-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #0284c7;
        }
    </style>
</head>
<body class="bg-slate-200 dark:bg-slate-950 font-sans antialiased text-slate-800 dark:text-slate-200 flex flex-col md:flex-row h-screen overflow-hidden transition-colors duration-500 relative">

                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>

                        <svg id="preview-icon-on" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>

                    </button>

                <!-- Controles de Orden -->

    <script>
        // Configuración requerida
        const API_KEY = 'AIzaSyARv4q_6_aDPE9JAwN9pcoKtDF-0v1csQE';
        const ROOT_FOLDER_ID = '1imz_VssaBHmkh-HhN0493I4rDUqu-r5J'; // ID de la carpeta principal

        // --- METADATOS PERSONALIZADOS ---
        // Ahora se intentará leer dinámicamente desde un "config.json" en tu Drive
        let fileMetadata = {};

        // Estado global de la aplicación
        let currentItems = [];
        let currentSort = 'default';
        let currentView = 'grid';
        let currentFolderId = null;
        let usePreviews = true; // Controla si se muestran las vistas previas de imágenes
        let zoomLevels = { list: 100, grid: 100 };
        const savedZoomLevels = localStorage.getItem('driveUxZoomLevels');
        if (savedZoomLevels) {
            try {
                const parsedZoom = JSON.parse(savedZoomLevels);
                // Validación básica para asegurar que el objeto cargado es válido
                if (parsedZoom && typeof parsedZoom.list === 'number' && typeof parsedZoom.grid === 'number') {
                    zoomLevels = parsedZoom;
                }
            } catch (e) {
                console.error("Error al parsear los niveles de zoom guardados.", e);
                localStorage.removeItem('driveUxZoomLevels'); // Limpiar datos corruptos
            }
        }
        let navigationStack = [{ id: ROOT_FOLDER_ID, name: 'Inicio' }];
        
        // --- INICIALIZAR TEMA OSCURO ---
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>';
            } else {
                document.documentElement.classList.remove('dark');
            }
        }
        
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('theme-icon').innerHTML = isDark 
                ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>'
                : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>';
        }

        let currentPdfBlobUrl = null;

        async function openPdfViewer(fileId, title) {
            const modal = document.getElementById('pdf-viewer-modal');
            const iframe = document.getElementById('pdf-iframe');
            const titleEl = document.getElementById('pdf-viewer-title');
            const loading = document.getElementById('pdf-loading');

            titleEl.textContent = title;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            iframe.classList.add('hidden');
            loading.classList.remove('hidden');
            loading.innerHTML = '<div class="loader"></div>';

            try {
                const url = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${API_KEY}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Error al cargar el PDF');
                
                const blob = await response.blob();
                const pdfBlob = new Blob([blob], { type: 'application/pdf' });
                
                if (currentPdfBlobUrl) {
                    URL.revokeObjectURL(currentPdfBlobUrl);
                }
                currentPdfBlobUrl = URL.createObjectURL(pdfBlob);
                
                iframe.onload = () => {
                    loading.classList.add('hidden');
                    iframe.classList.remove('hidden');
                };
                iframe.src = currentPdfBlobUrl;
            } catch (error) {
                console.error(error);
                loading.innerHTML = '<p class="text-red-500 font-medium">Error al cargar el documento PDF.</p>';
            }
        }

        function closePdfViewer() {
            const modal = document.getElementById('pdf-viewer-modal');
            const iframe = document.getElementById('pdf-iframe');
            
            iframe.src = '';
            if (currentPdfBlobUrl) {
                URL.revokeObjectURL(currentPdfBlobUrl);
                currentPdfBlobUrl = null;
            }
            
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
        initTheme(); // Ejecutar al cargar la página

        const getIconForType = (mimeType, fileName, isFolder) => {
            if (isFolder) return `<svg class="w-6 h-6 text-blue-500 drop-shadow-sm transition-colors duration-500" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg>`;
            
            const extension = fileName ? fileName.split('.').pop().toLowerCase() : '';

            switch (extension) {
                case 'lsp':
                    return `<svg class="w-6 h-6 text-indigo-500 drop-shadow-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></svg>`;
                case 'txt':
                    return `<svg class="w-6 h-6 text-gray-500 drop-shadow-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>`;
                case 'dwg':
                    return `<svg class="w-6 h-6 text-red-600 drop-shadow-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2v20"/><path d="M17 3.34a10 10 0 0 1 0 17.32"/><path d="M7 20.66a10 10 0 0 1 0-17.32"/></svg>`;
                case 'zip':
                case 'rar':
                case '7z':
                    return `<svg class="w-6 h-6 text-yellow-600 drop-shadow-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>`;
            }

            if (mimeType.includes('image')) return `<svg class="w-6 h-6 text-sky-500 drop-shadow-sm transition-colors duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>`;
            if (mimeType.includes('pdf')) return `<svg class="w-6 h-6 text-red-500 drop-shadow-sm transition-colors duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>`;
            return `<svg class="w-6 h-6 text-slate-500 drop-shadow-sm transition-colors duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>`;
        };

        async function fetchMetadataConfig() {
            try {
                const query = `'${ROOT_FOLDER_ID}' in parents and name = 'config.json' and trashed = false`;
                const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&key=${API_KEY}`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.files && data.files.length > 0) {
                    const configRes = await fetch(`https://www.googleapis.com/drive/v3/files/${data.files[0].id}?alt=media&key=${API_KEY}`);
                    fileMetadata = await configRes.json();
                }
            } catch (e) {
                console.warn("No config.json encontrado. Se usarán metadatos por defecto.", e);
            }
        }

        async function downloadFile(fileId, fileName) {
            const url = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${API_KEY}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Error HTTP: ${response.status}`);
            const blob = await response.blob();
            const blobUrl = window.URL.createObjectURL(blob);
            const a = Object.assign(document.createElement('a'), { href: blobUrl, download: fileName });
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(blobUrl);
            a.remove();
        }

        async function fetchDriveFolders() {
            const query = `'${ROOT_FOLDER_ID}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`;
            const fields = 'files(id,name)';
            const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=${encodeURIComponent(fields)}&key=${API_KEY}`;

            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
            const data = await response.json();
            return data.files || [];
        }

        async function fetchDriveItems(folderId) {
            if (!folderId) return [];
            const query = `'${folderId}' in parents and trashed = false`;
            const fields = 'files(id,name,modifiedTime,size,webViewLink,hasThumbnail,thumbnailLink,mimeType)';
            const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=${encodeURIComponent(fields)}&key=${API_KEY}`;
 
            const response = await fetch(url);
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error.message || `HTTP Error: ${response.status}`);
            }
            const data = await response.json();
            return data.files || [];
        }

        function formatSize(bytes) {
            if (!bytes || bytes === 0) return '--';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function displayFiles() {
            const listContainer = document.getElementById('file-list');
            const listHeader = document.getElementById('list-header');
            const loadingState = document.getElementById('loading-state');
            
            loadingState.classList.add('hidden');

            let filesToDisplay;
            const searchTerm = document.getElementById('search-box').value.trim().toLowerCase();

            if (searchTerm) {
                filesToDisplay = currentItems.filter(file => {
                    const metadata = fileMetadata[file.id] || {};
                    const title = metadata.title || file.name;
                    return title.toLowerCase().includes(searchTerm);
                });
            } else {
                filesToDisplay = currentItems;
            }

            let sortedFiles = [...filesToDisplay];
            switch (currentSort) {
                case 'name_asc': sortedFiles.sort((a, b) => a.name.localeCompare(b.name)); break;
                case 'name_desc': sortedFiles.sort((a, b) => b.name.localeCompare(a.name)); break;
                case 'date_desc': sortedFiles.sort((a, b) => new Date(b.modifiedTime) - new Date(a.modifiedTime)); break;
                case 'date_asc': sortedFiles.sort((a, b) => new Date(a.modifiedTime) - new Date(b.modifiedTime)); break;
            }
            
            // Asegurar que las carpetas siempre se muestren primero
            sortedFiles.sort((a, b) => {
                const aIsFolder = a.mimeType === 'application/vnd.google-apps.folder';
                const bIsFolder = b.mimeType === 'application/vnd.google-apps.folder';
                if (aIsFolder && !bIsFolder) return -1;
                if (!aIsFolder && bIsFolder) return 1;
                return 0;
            });

            // Reiniciar animación de transición
            listContainer.className = '';
            void listContainer.offsetWidth;
        
            listContainer.style.setProperty('--zoom-factor', zoomLevels[currentView] / 100);

            if (currentView === 'grid') {
                listHeader.style.display = 'none';
                listContainer.className = 'w-full flex flex-wrap gap-1';
            } else {
                listHeader.style.display = '';
                listContainer.className = 'w-full flex flex-col gap-1';
            }

            if (sortedFiles.length === 0) {
                listContainer.innerHTML = `
                    <div class="col-span-full py-20 flex flex-col items-center justify-center text-center">
                        <div class="w-24 h-24 mb-6 rounded-full bg-slate-200/50 dark:bg-slate-800/50 flex items-center justify-center">
                            <svg class="w-10 h-10 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                        </div>
                        <h3 class="text-xl font-bold text-slate-900 dark:text-white">Directorio vacío</h3>
                        <p class="text-slate-500 mt-2">No se encontraron elementos.</p>
                    </div>`;
                listContainer.classList.remove('hidden');
                return;
            }

            listContainer.innerHTML = sortedFiles.map(file => {
                const isFolder = file.mimeType === 'application/vnd.google-apps.folder';
                const metadata = fileMetadata[file.id] || {};
                const title = metadata.title || file.name;

                const dateObj = file.modifiedTime ? new Date(file.modifiedTime) : new Date();
                const formattedDate = dateObj.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
                const formattedSize = formatSize(file.size);
                const iconSVG = getIconForType(file.mimeType, file.name, isFolder);
                
                const isPdf = file.mimeType === 'application/pdf';
                let actionClick;
                if (isFolder) {
                    actionClick = `navigateToFolder('${file.id}', '${file.name.replace(/'/g, "\\'")}')`;
                } else if (isPdf) {
                    actionClick = `openPdfViewer('${file.id}', '${title.replace(/'/g, "\\'")}')`;
                } else {
                    actionClick = `window.open('${file.webViewLink}', '_blank')`;
                }
                const downloadAction = `event.stopPropagation(); downloadFile('${file.id}', '${file.name.replace(/'/g, "\\'")}')`;

                if (currentView === 'grid') {
                    const hasVisualPreview = usePreviews && !isFolder && (metadata.imageUrl || (file.hasThumbnail && file.thumbnailLink));
                    const containerStyle = hasVisualPreview 
                        ? `height: calc(200px * var(--zoom-factor, 1));` 
                        : `width: calc(145px * var(--zoom-factor, 1)); height: calc(200px * var(--zoom-factor, 1));`;
                        
                    const downloadBtn = !isFolder ? `<button onclick="${downloadAction}" class="absolute top-2 right-2 z-20 p-1.5 bg-slate-900/60 hover:bg-slate-900/90 text-white rounded-lg opacity-0 group-hover:opacity-100 transition-all duration-300 backdrop-blur-md shadow-sm" title="Descargar"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg></button>` : '';

                    let preview = '';
                    if (isFolder) {
                        preview = `<div class="absolute inset-0 bg-gradient-to-br from-sky-100 to-blue-50 dark:from-sky-900/40 dark:to-blue-900/20 opacity-50 transition-colors duration-500"></div>
                                   <div class="relative z-10 scale-150 opacity-20 transition-opacity duration-500 group-hover:opacity-40">${iconSVG}</div>`;
                    } else if (hasVisualPreview) {
                        const imageUrl = metadata.imageUrl || file.thumbnailLink.replace(/=s\d+/, '=s600');
                        preview = `<img src="${imageUrl}" loading="lazy" class="h-full w-auto max-w-none transition-transform duration-700" onload="this.closest('.file-item-wrapper').classList.add('is-loaded')">`;
                    } else {
                        preview = `<div class="absolute inset-0 bg-slate-100 dark:bg-slate-800/80 transition-colors duration-500"></div>
                                   <div class="relative z-10 scale-150 opacity-50 transition-opacity duration-500 group-hover:opacity-80">${iconSVG}</div>`;
                    }

                    return `
                    <div onclick="${actionClick}" class="group file-item-wrapper flex flex-col cursor-pointer shrink-0 ${!hasVisualPreview ? 'is-loaded' : ''}">
                        <div class="relative overflow-hidden glass-panel bg-white/60 dark:bg-slate-900/60 border border-white/80 dark:border-slate-700/50 shadow-sm hover:shadow-md transition-all duration-300 flex items-center justify-center rounded-md" style="${containerStyle}">
                            ${preview}
                            ${downloadBtn}
                        </div>
                        <div class="mt-3 px-2 flex flex-col shrink-0 items-center text-center w-0 min-w-full">
                            <h3 class="text-sm font-bold text-slate-900 dark:text-white truncate w-full transition-colors duration-500" title="${title}">${title}</h3>
                            <span class="text-xs font-semibold text-slate-500 mt-1 transition-colors duration-500">${isFolder ? 'Carpeta' : formattedSize}</span>
                        </div>
                    </div>`;
                } else {
                    return `
                    <div onclick="${actionClick}" class="group file-item-wrapper is-loaded grid grid-cols-12 gap-4 px-8 glass-panel bg-white/40 dark:bg-slate-900/40 hover:bg-white/80 dark:hover:bg-slate-800/80 items-center transition-all duration-300 rounded-lg border border-transparent hover:border-white/80 dark:hover:border-slate-700 hover:shadow-md cursor-pointer" style="padding-top: calc(1rem * var(--zoom-factor, 1)); padding-bottom: calc(1rem * var(--zoom-factor, 1));">
                        <div class="col-span-12 md:col-span-6 flex items-center overflow-hidden gap-4">
                            <div class="rounded-xl bg-white dark:bg-slate-800 shadow-sm flex items-center justify-center shrink-0 transition-all duration-500" style="width: calc(2.5rem * var(--zoom-factor, 1)); height: calc(2.5rem * var(--zoom-factor, 1));">
                                ${iconSVG}
                            </div>
                            <span class="text-sm font-bold text-slate-800 dark:text-slate-200 truncate group-hover:text-primary transition-colors duration-500" title="${title}">${title}</span>
                        </div>
                        <div class="hidden md:block col-span-3 text-sm font-medium text-slate-500 transition-colors duration-500">${formattedDate}</div>
                        <div class="hidden md:flex col-span-3 justify-end items-center text-sm font-bold text-slate-400 transition-colors duration-500 gap-3">
                            <span class="bg-slate-200/50 dark:bg-slate-800/80 py-1 px-3 rounded-lg transition-colors duration-500">${isFolder ? '--' : formattedSize}</span>
                            ${!isFolder ? `<button onclick="${downloadAction}" class="p-1.5 text-slate-400 hover:text-primary hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg opacity-0 group-hover:opacity-100 transition-all duration-300" title="Descargar"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg></button>` : `<div class="w-7"></div>`}
                        </div>
                    </div>`;
                }
            }).join('');
            
            listContainer.classList.remove('hidden');
        }

        async function navigateToFolder(folderId, folderName, fromSidebar = false) {
            if (fromSidebar) {
                if (folderId === ROOT_FOLDER_ID) {
                    navigationStack = [{ id: ROOT_FOLDER_ID, name: 'Inicio' }];
                } else {
                    navigationStack = [{ id: ROOT_FOLDER_ID, name: 'Inicio' }, { id: folderId, name: folderName }];
                }
            } else if (folderId === ROOT_FOLDER_ID) {
                navigationStack = [{ id: ROOT_FOLDER_ID, name: 'Inicio' }];
            } else {
                const existingIndex = navigationStack.findIndex(item => item.id === folderId);
                if (existingIndex !== -1) {
                    navigationStack = navigationStack.slice(0, existingIndex + 1);
                } else {
                    navigationStack.push({ id: folderId, name: folderName });
                }
            }

            currentFolderId = folderId;
            document.getElementById('search-box').value = '';

            // Resaltar en sidebar
            document.querySelectorAll('#sidebar-nav button').forEach(btn => {
                const isActive = btn.dataset.id === folderId;
                btn.className = `whitespace-nowrap md:whitespace-normal md:w-full text-left px-4 md:px-4 py-2 md:py-3 rounded-2xl text-sm transition-all flex items-center gap-3 flex-shrink-0 md:flex-shrink group ${isActive ? 'bg-white/60 dark:bg-slate-800/60 text-primary font-semibold shadow-sm border border-white/50 dark:border-slate-700/50' : 'text-slate-500 border border-transparent hover:bg-white/40 dark:hover:bg-slate-800/40 hover:text-slate-900 dark:hover:text-white'}`;
            });

            const loadingState = document.getElementById('loading-state');
            const listContainer = document.getElementById('file-list');
            listContainer.classList.add('hidden');
            loadingState.classList.remove('hidden');

            try {
                currentItems = await fetchDriveItems(folderId);
                displayFiles();
            } catch (error) {
                document.getElementById('error-message').textContent = "Error al conectar con Drive: " + error.message;
                loadingState.classList.add('hidden');
                document.getElementById('error-state').classList.remove('hidden');
            }
        }

        function renderSidebar(folders) {
            const nav = document.getElementById('sidebar-nav');
            
            const homeButton = `
                <button data-id="${ROOT_FOLDER_ID}" onclick="navigateToFolder('${ROOT_FOLDER_ID}', 'Inicio', true)"
                    class="whitespace-nowrap md:whitespace-normal md:w-full text-left px-4 md:px-4 py-2 md:py-3 rounded-2xl text-sm transition-all flex items-center gap-3 flex-shrink-0 md:flex-shrink group text-slate-500 border border-transparent hover:bg-white/40 dark:hover:bg-slate-800/40 hover:text-slate-900 dark:hover:text-white">
                    <svg class="w-4 h-4 opacity-70 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-8 8a1 1 0 001.414 1.414L4 11.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-5.586l.293.293a1 1 0 001.414-1.414l-8-8z"></path></svg>
                    <span class="truncate font-medium flex-grow">Inicio</span>
                </button>
            `;

            const folderButtons = folders.map(folder => `
                <button data-id="${folder.id}" onclick="navigateToFolder('${folder.id}', '${folder.name.replace(/'/g, "\\'")}', true)"
                    class="whitespace-nowrap md:whitespace-normal md:w-full text-left px-4 md:px-4 py-2 md:py-3 rounded-2xl text-sm transition-all flex items-center gap-3 flex-shrink-0 md:flex-shrink group text-slate-500 border border-transparent hover:bg-white/40 dark:hover:bg-slate-800/40 hover:text-slate-900 dark:hover:text-white">
                    <svg class="w-4 h-4 opacity-70 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path></svg>
                    <span class="truncate font-medium flex-grow">${folder.name}</span>
                </button>
            `).join('');

            nav.innerHTML = homeButton + folderButtons;
        }

        async function main() {
            const loadingState = document.getElementById('loading-state');
            const errorState = document.getElementById('error-state');
            const sidebarNav = document.getElementById('sidebar-nav');

            loadingState.classList.remove('hidden');
            errorState.classList.add('hidden');
            sidebarNav.innerHTML = '<div class="flex justify-center items-center p-4 w-full"><div class="loader"></div></div>';

            const activeClass = 'px-4 py-2 text-sm font-semibold rounded-xl text-slate-900 dark:text-white bg-white dark:bg-slate-700 shadow-sm transition-all';
            const inactiveClass = 'px-4 py-2 text-sm font-medium rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all';
            document.querySelectorAll('#view-controls button').forEach(btn => btn.className = inactiveClass);
            document.querySelector(`#view-controls button[data-view="${currentView}"]`).className = activeClass;
            
            // Establecer el valor inicial del slider de zoom desde la configuración cargada
            document.getElementById('zoom-slider').value = zoomLevels[currentView];
            document.getElementById('zoom-percentage').textContent = `${zoomLevels[currentView]}%`;
            document.getElementById('file-list').style.setProperty('--zoom-factor', zoomLevels[currentView] / 100);
            
            try {
                const folders = await fetchDriveFolders();
                folders.sort((a, b) => a.name.localeCompare(b.name)); // Ordenar carpetas alfabéticamente
                renderSidebar(folders);

                // Cargar metadatos dinámicos
                await fetchMetadataConfig();

                // Navegar a la carpeta raíz para mostrar las carpetas principales como items
                navigateToFolder(ROOT_FOLDER_ID, 'Inicio', true);
            } catch (error) {
                sidebarNav.innerHTML = '<div class="p-4 text-sm text-red-500 w-full text-center md:text-left">Error de conexión.</div>';
                loadingState.classList.add('hidden');
                errorState.classList.remove('hidden');
                document.getElementById('error-message').textContent = "No se pudieron cargar las carpetas. " + error.message;
            }
        }

        document.getElementById('sort-options').addEventListener('change', (e) => {
            currentSort = e.target.value;
            displayFiles();
        });

        document.getElementById('view-controls').addEventListener('click', (e) => {
            const button = e.target.closest('button');
            if (!button) return;
            const view = button.dataset.view;
            const listContainer = document.getElementById('file-list');

            if (view && view !== currentView) {
                listContainer.classList.add('animate-fade-out');
                
                setTimeout(() => {
                    currentView = view;
                
                    document.getElementById('zoom-slider').value = zoomLevels[currentView];
                    document.getElementById('zoom-percentage').textContent = `${zoomLevels[currentView]}%`;
                    
                    const listBtn = document.querySelector('[data-view="list"]');
                    const gridBtn = document.querySelector('[data-view="grid"]');
                    
                    const activeClass = 'px-4 py-2 text-sm font-semibold rounded-xl text-slate-900 dark:text-white bg-white dark:bg-slate-700 shadow-sm transition-all';
                    const inactiveClass = 'px-4 py-2 text-sm font-medium rounded-xl text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all';

                    if (view === 'list') {
                        listBtn.className = activeClass;
                        gridBtn.className = inactiveClass;
                    } else {
                        gridBtn.className = activeClass;
                        listBtn.className = inactiveClass;
                    }

                    displayFiles();
                }, 200); // Coincide con la duración de fade-out
            }
        });

        document.getElementById('zoom-slider').addEventListener('input', (e) => {
            zoomLevels[currentView] = parseInt(e.target.value, 10);
            document.getElementById('zoom-percentage').textContent = `${e.target.value}%`;
            document.getElementById('file-list').style.setProperty('--zoom-factor', zoomLevels[currentView] / 100);
            localStorage.setItem('driveUxZoomLevels', JSON.stringify(zoomLevels));
        });

        document.getElementById('preview-toggle-btn').addEventListener('click', () => {
            usePreviews = !usePreviews;
            document.getElementById('preview-icon-on').classList.toggle('hidden', !usePreviews);
            document.getElementById('preview-icon-off').classList.toggle('hidden', usePreviews);
            displayFiles();
        });

        // Inicializar estado del interruptor de vista previa
        document.getElementById('preview-icon-on').classList.toggle('hidden', !usePreviews);
        document.getElementById('preview-icon-off').classList.toggle('hidden', usePreviews);

        document.getElementById('search-box').addEventListener('input', displayFiles);
        document.addEventListener('DOMContentLoaded', () => {
            main();
            document.getElementById('pdf-viewer-close').addEventListener('click', closePdfViewer);
            // Cerrar modal con la tecla Escape
            document.addEventListener('keydown', (e) => {
                if (e.key === "Escape" && !document.getElementById('pdf-viewer-modal').classList.contains('hidden')) {
                    closePdfViewer();
                }
            });
        });
    </script>
</body>
</html>
